# Runs on every push and pull request: store-policy lint, solvability check, build, headless smoke test.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          retention-days: 14
